<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Generador de Invitaciones XV</title>

<style>

body{
    font-family:Arial,sans-serif;
    max-width:1100px;
    margin:40px auto;
    padding:20px;
    background:#fafafa;
}

h1{
    text-align:center;
    margin-bottom:25px;
}

.card{
    background:white;
    border:1px solid #ddd;
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

input,
textarea{
    width:95%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:14px;
}

textarea{
    min-height:220px;
    resize:vertical;
    font-family:monospace;
}

button{

    border:none;
    background:#c5a059;
    color:white;

    padding:12px 25px;
    border-radius:8px;

    cursor:pointer;
}

button:hover{
    opacity:.9;
}

.generate-btn{
    margin-top:15px;
}

.result-card{
    background:white;
    border:1px solid #ddd;
    border-radius:12px;
    padding:20px;
    margin-top:15px;
}

.url{

    word-break:break-all;

    padding:10px;

    background:#f5f5f5;

    border-radius:8px;

    margin-top:10px;
    margin-bottom:10px;

    font-family:monospace;
}

.copy-btn{

    border:none;
    background:#c5a059;
    color:white;

    padding:10px 18px;
    border-radius:8px;

    cursor:pointer;
}

.success{
    color:green;
    margin-left:10px;
}

.info{
    background:white;
    border:1px solid #ddd;
    border-radius:12px;
    padding:15px;
    margin-bottom:20px;
}

</style>

</head>

<body>

<h1>Generador de Invitaciones XV</h1>

<div class="info">

    <strong>URL principal</strong>

    <br><br>

    Ejemplos:

    <br>

    <code>
    http://127.0.0.1:5500/index.html
    </code>

    <br>

    <code>
    https://misxv.com
    </code>

</div>

<div class="card">

    <label>
        URL principal de la invitación
    </label>

    <input
        id="baseUrl"
        type="text"
        value="http://127.0.0.1:5500/index.html">

    <br><br>

    <label>
        Invitados (uno por línea)
    </label>

    <textarea id="inputData">

Gabriel Moreno, Sra e Hijas|5
Otros Moreno, Sra e Hija|3
Familia Pérez|4

    </textarea>

    <button
    class="generate-btn"
    onclick="generar()">

        Generar URLs

    </button>

</div>

<div id="resultado"></div>

<script>

function generar(){

    const resultado =
    document.getElementById("resultado");

    resultado.innerHTML = "";

    const baseUrl =
    document.getElementById("baseUrl")
    .value
    .trim();

    if(!baseUrl){

        alert(
            "Debes ingresar la URL principal."
        );

        return;
    }

    const lineas =
    document
    .getElementById("inputData")
    .value
    .split("\n")
    .filter(
        linea => linea.trim() !== ""
    );

    lineas.forEach((linea,index)=>{

        const partes =
        linea.split("|");

        if(partes.length < 2){
            return;
        }

        const nombre =
        partes[0].trim();

        const cantidad =
        partes[1].trim();

        const payload = {

            i:nombre,
            c:Number(cantidad)

        };

        const exp = encodeSafe(payload);

        const url =
        `${baseUrl}?id=${exp}`;

        resultado.innerHTML += `

        <div class="result-card">

            <h3>

                ${nombre}
                (${cantidad})

            </h3>

            <div
            class="url"
            id="url-${index}">

                ${url}

            </div>

            <button
            class="copy-btn"
            onclick="copiar(${index})">

                Copiar URL

            </button>

            <span
            id="msg-${index}"
            class="success">

            </span>

        </div>

        `;

    });

}

function encodeSafe(obj){

    return btoa(
        JSON.stringify(obj)
    )
    .replace(/\+/g, '-')
    .replace(/\//g, '_')
    .replace(/=+$/g, '');

}

function copiar(index){

    const texto =
    document.getElementById(
        `url-${index}`
    ).innerText;

    navigator.clipboard.writeText(
        texto
    );

    const msg =
    document.getElementById(
        `msg-${index}`
    );

    msg.innerText =
    "✓ Copiado";

    setTimeout(()=>{

        msg.innerText = "";

    },2000);

}

</script>

</body>
</html>
